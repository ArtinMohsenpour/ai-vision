# Local development database. The app itself runs on the host with `pnpm dev`.
services:
  postgres:
    image: postgres:18-alpine
    container_name: ai-vision-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '127.0.0.1:5437:5432'
    volumes:
      - ai_vision_pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ai_vision_pgdata:
